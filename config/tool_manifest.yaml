        description: "Prepare a Gemini Batch API OCR JSONL file and optionally submit the remote batch job."
        description_ru: "Подготовить JSONL для Gemini Batch API OCR и при необходимости отправить удалённый batch job."
        tooltip: "For large, non-urgent Gemini OCR runs. Batch is asynchronous and cheaper, but results are collected later by job id."
