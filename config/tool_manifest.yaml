tool:
  id: audion_office_ocr_ai
  name: "Audion Office OCR AI"
  category: "OCR / Office"
  version: "0.2.0-gui-preview"

paths:
  input: "input"
  output: "output"
  logs: "logs"
  report: "report"
  workspace: "workspace"
  config: "config"
  release: "release"

ui:
  title: "Audion Office OCR AI"
  host: "127.0.0.1"
  port: 8080
  native: false
  reload: false
  open_browser: true

operations:
  - id: extract_local
    title: "Convert to Markdown/MD"
    title_ru: "КОНВЕРТАЦИЯ В MARKDOWN/MD"
    description: "Convert text-based office files from input to Markdown in output."
    description_ru: "Конвертировать DOCX/XLSX/PPTX/PDF/TXT/CSV/HTML из input в Markdown/MD внутри output без AI OCR."
    service: "system_core.services.office_service:extract_local"
    kind: "safe"

  - id: build_docx
    title: "Build DOCX"
    title_ru: "Собрать DOCX"
    description: "Compile Markdown files from input into office-style DOCX files."
    description_ru: "Собрать Markdown-файлы из input в офисные DOCX."
    service: "system_core.services.office_service:build_docx"
    kind: "safe"

  - id: build_xlsx
    title: "Build XLSX"
    title_ru: "Собрать XLSX"
    description: "Extract Markdown tables from input into Excel workbooks."
    description_ru: "Извлечь Markdown-таблицы из input в книги Excel."
    service: "system_core.services.office_service:build_xlsx"
    kind: "safe"

operation_groups:
  - id: extract
    title: "Extract to Markdown"
    title_ru: "Извлечь в Markdown"
    description: "Create auditable Markdown from office files, PDFs, and scans."
    description_ru: "Получить проверяемый Markdown из офисных файлов, PDF и сканов."
    tooltip: "Start here when the source is an office file, PDF, scan, or image and you need clean Markdown for review or later DOCX/PDF export."
    tooltip_ru: "Начинайте отсюда, если источник - офисный файл, PDF, скан или изображение, а на выходе нужен чистый Markdown для проверки и дальнейшей сборки DOCX/PDF."
    children:
      - id: extract_local
        title: "Convert to Markdown/MD"
        title_ru: "КОНВЕРТАЦИЯ В MARKDOWN/MD"
        description: "DOCX/XLSX/PPTX/PDF/TXT/CSV/HTML to Markdown/MD without AI OCR."
        description_ru: "DOCX/XLSX/PPTX/PDF/TXT/CSV/HTML в Markdown/MD без AI OCR: быстрое извлечение уже выделяемого офисного текста."
        tooltip: "Use this for files that already contain selectable text. It does not try to read pixels from scanned pages."
        tooltip_ru: "Для файлов, где текст уже выделяется мышкой. Этот режим не читает пиксели со сканов и не запускает OCR."
        service: "system_core.services.office_service:extract_local"
        kind: "safe"

      - id: ocr_brick
        title: "OCR Brick (preprocess + engines)"
        title_ru: "OCR Brick: препроцессинг и движки"
        description: "Run the new parameter-driven preprocess pipeline and selected OCR engine."
        description_ru: "Запустить новый параметрический препроцессинг и выбранный движок OCR."
        tooltip: "Main scan/image OCR pipeline: cleans the page first, then sends it to a local OCR engine or a paid vision/OCR API."
        tooltip_ru: "Главный OCR-пайплайн для сканов и картинок: сначала чистит страницу, потом отдаёт её локальному движку или платной OCR/vision API-модели."
        service: "system_core.services.office_service:ocr_brick_run"
        kind: "safe"
        parameters:
          provider: "yandex"
        fields:
          - id: ocr_engine
            type: "radio"
            choice_style: "buttons"
            choice_columns: 7
            choice_compact: true
            hide_label: true
            label: "Engine"
            label_ru: "Движок"
            default: "tesseract"
            span: "full"
            options:
              - value: "tesseract"
                label: "Tesseract"
                label_ru: "Tesseract"
                tone: "local"
                tooltip: "Local OCR with word boxes; best with binarized text scans."
                tooltip_ru: "Локальный OCR с координатами слов; лучше для бинаризованных текстовых сканов."
              - value: "surya"
                label: "Surya"
                label_ru: "Surya"
                tone: "local"
                tooltip: "Local Surya OCR/layout through the optional portable runtime."
                tooltip_ru: "Локальный Surya OCR/layout через optional portable runtime."
              - value: "yandex"
                label: "Yandex"
                label_ru: "Yandex"
                tone: "yandex"
                tooltip: "Cloud OCR with word boxes; useful for difficult Russian scans."
                tooltip_ru: "Облачный OCR с координатами слов; полезен для сложных русских сканов."
              - value: "xai"
                label: "xAI"
                label_ru: "xAI"
                tone: "vision"
                tooltip: "xAI vision OCR returns Markdown/text without word boxes."
                tooltip_ru: "xAI vision OCR возвращает Markdown/текст без координат слов."
              - value: "mistral"
                label: "Mistral OCR 4"
                label_ru: "Mistral OCR 4"
                tone: "vision"
                tooltip: "Dedicated multilingual OCR with Markdown, tables, typed blocks, bounding boxes and confidence scores."
                tooltip_ru: "Специализированный мультиязычный OCR: Markdown, таблицы, типы блоков, координаты и confidence."
              - value: "gemini"
                label: "Gemini"
                label_ru: "Gemini"
                tone: "vision"
                tooltip: "Keep using the existing Gemini AI OCR route for this milestone."
                tooltip_ru: "На этом этапе используйте существующий маршрут Gemini AI OCR."
              - value: "chatgpt"
                label: "ChatGPT"
                label_ru: "ChatGPT"
                tone: "vision"
                tooltip: "Keep using the existing OpenAI AI OCR route for this milestone."
                tooltip_ru: "На этом этапе используйте существующий маршрут OpenAI AI OCR."
          - id: ocr_preprocess_profile
            type: "radio"
            choice_style: "buttons"
            choice_columns: 5
            group: "filters"
            hide_label: true
            label: "Scan cleanup"
            label_ru: "Очистка скана"
            default: "auto"
            span: "full"
            hint: "Auto uses tuned defaults for the selected engine. Raw disables cleanup. Numbers boosts contrast/sharpening for legal and financial IDs. Manual opens the old detailed knobs in Advanced."
            hint_ru: "Авто использует настроенные defaults под выбранный движок. Без очистки отдаёт страницу как есть. Цифры усиливает контраст/резкость для реквизитов. Ручной открывает старые детальные тумблеры в Advanced."
            options:
              - value: "auto"
                label: "Auto"
                label_ru: "Авто"
                tone: "process"
                tooltip: "Recommended: engine-aware cleanup for Tesseract, Surya, Yandex, and vision API models."
                tooltip_ru: "Рекомендуется: очистка под выбранный движок Tesseract, Surya, Yandex или vision API."
              - value: "raw"
                label: "Raw"
                label_ru: "Без очистки"
                tone: "raw"
                tooltip: "Skip preprocessing completely; useful when the scan is already clean and processing makes it worse."
                tooltip_ru: "Полностью пропустить препроцессинг; полезно, если скан уже чистый и обработка только портит."
              - value: "heavy"
                label: "Heavy scan"
                label_ru: "Тяжёлый скан"
                tone: "warn"
                tooltip: "More aggressive denoise, contrast and sharpening for damaged JPEG scans."
                tooltip_ru: "Более агрессивное шумоподавление, контраст и резкость для повреждённых JPEG-сканов."
              - value: "numbers"
                label: "Numbers"
                label_ru: "Цифры"
                tone: "warn"
                tooltip: "Contrast/sharpening profile for contracts, IKZ, dates, sums and other exact legal or financial fields."
                tooltip_ru: "Профиль контраста/резкости для контрактов, ИКЗ, дат, сумм и других точных юридических или финансовых реквизитов."
              - value: "manual"
                label: "Manual"
                label_ru: "Ручной"
                tone: "cpu"
                tooltip: "Shows the detailed preprocessing switches in Advanced."
                tooltip_ru: "Показывает подробные переключатели препроцессинга в Advanced."
          - id: preprocess_enabled
            type: "radio"
            choice_style: "buttons"
            choice_columns: 2
            group: "filters"
            advanced: true
            show_if:
              ocr_preprocess_profile: "manual"
            label: "Preprocess"
            label_ru: "Препроцессинг"
            default: true
            span: "full"
            options:
              - value: true
                label: "On"
                label_ru: "Включен"
                tone: "process"
              - value: false
                label: "Raw passthrough"
                label_ru: "Без обработки"
                tone: "raw"
          - id: ocr_sr_scale
            type: "radio"
            choice_style: "buttons"
            choice_columns: 3
            group: "filters"
            advanced: true
            show_if:
              ocr_preprocess_profile: "manual"
            label: "Upscale"
            label_ru: "Апскейл"
            default: 2
            span: "full"
            options:
              - value: 0
                label: "Off"
                label_ru: "Выкл"
                tone: "cpu"
              - value: 2
                label: "2x"
                label_ru: "2x"
                tone: "gpu"
              - value: 4
                label: "4x"
                label_ru: "4x"
                tone: "gpu"
          - id: ocr_sr_model
            type: "radio"
            choice_style: "buttons"
            choice_columns: 3
            group: "filters"
            show_if:
              ocr_preprocess_profile: "manual"
              ocr_sr_scale: [2, 4]
            advanced: true
            label: "SR model"
            label_ru: "SR модель"
            default: "auto"
            span: "full"
            options:
              - value: "auto"
                label: "Auto"
                label_ru: "Авто"
              - value: "general"
                label: "General"
                label_ru: "General"
                tone: "process"
              - value: "sharp"
                label: "Sharp"
                label_ru: "Sharp"
                tone: "warn"
          - id: ocr_denoise
            type: "radio"
            choice_style: "buttons"
            choice_columns: 3
            group: "filters"
            advanced: true
            show_if:
              ocr_preprocess_profile: "manual"
            label: "Denoise"
            label_ru: "Шум JPEG"
            default: "weak"
            span: "full"
            options:
              - value: "none"
                label: "None"
                label_ru: "Нет"
              - value: "weak"
                label: "Weak"
                label_ru: "Слабый"
                tone: "process"
              - value: "strong"
                label: "Strong"
                label_ru: "Сильный"
                tone: "warn"
          - id: ocr_contrast
            type: "radio"
            choice_style: "buttons"
            choice_columns: 3
            group: "filters"
            advanced: true
            show_if:
              ocr_preprocess_profile: "manual"
            label: "Contrast"
            label_ru: "Контраст"
            default: "auto"
            span: "full"
            options:
              - value: "auto"
                label: "Auto"
                label_ru: "Авто"
                tone: "process"
              - value: "normal"
                label: "Normal"
                label_ru: "Норма"
                tone: "cpu"
              - value: "high"
                label: "High"
                label_ru: "Высокий"
                tone: "warn"
          - id: ocr_unsharp
            type: "radio"
            choice_style: "buttons"
            choice_columns: 3
            group: "filters"
            advanced: true
            show_if:
              ocr_preprocess_profile: "manual"
            label: "Unsharp"
            label_ru: "Unsharp"
            default: "auto"
            span: "full"
            options:
              - value: "auto"
                label: "Auto"
                label_ru: "Авто"
                tone: "process"
              - value: "off"
                label: "Off"
                label_ru: "Выкл"
                tone: "raw"
              - value: "strong"
                label: "Strong"
                label_ru: "Сильный"
                tone: "warn"
          - id: ocr_binarize
            type: "radio"
            choice_style: "buttons"
            choice_columns: 3
            group: "filters"
            advanced: true
            show_if:
              ocr_preprocess_profile: "manual"
            label: "Binarize"
            label_ru: "Бинаризация"
            default: "auto"
            span: "full"
            options:
              - value: "auto"
                label: "Auto"
                label_ru: "Авто"
              - value: "on"
                label: "Force on"
                label_ru: "Включить"
                tone: "warn"
              - value: "off"
                label: "Force off"
                label_ru: "Выключить"
          - id: ocr_intent
            type: "radio"
            choice_style: "buttons"
            choice_columns: 2
            group: "filters"
            advanced: true
            show_if:
              ocr_preprocess_profile: "manual"
            label: "Intent"
            label_ru: "Цель очистки"
            default: "text"
            span: "full"
            options:
              - value: "text"
                label: "Text only"
                label_ru: "Только текст"
                tone: "process"
              - value: "image"
                label: "Preserve image"
                label_ru: "Беречь изображение"
          - id: ocr_output_contract
            type: "radio"
            choice_style: "buttons"
            choice_columns: 2
            group: "output"
            show_if:
              ocr_engine: ["tesseract", "surya", "yandex", "mistral"]
            label: "Output"
            label_ru: "Контракт"
            default: "text"
            span: "full"
            options:
              - value: "text"
                label: "Text + boxes"
                label_ru: "Текст + боксы"
                tone: "local"
              - value: "structured"
                label: "Layout"
                label_ru: "Раскладка"
                tone: "warn"
          - id: ocr_output_formats
            type: "checkboxes"
            checkbox_layout: "grouped_chips"
            checkbox_group_order: ["office", "dev"]
            group: "deliverables"
            hide_label: true
            label: "Output formats"
            label_ru: "Выходные форматы"
            default: ["docx"]
            span: "full"
            hint: "Select independent exports from the lossless internal DocumentModel. DOCX is the working default; every checked format is written immediately after OCR without rerunning recognition."
            hint_ru: "Выберите независимые экспорты из внутреннего DocumentModel без потерь. Рабочий дефолт — DOCX; каждый отмеченный формат записывается сразу после OCR без повторного распознавания."
            options:
              - value: "docx"
                label: "DOCX"
                label_ru: "DOCX"
                tone: "office"
              - value: "xlsx"
                label: "XLSX"
                label_ru: "XLSX"
                tone: "office"
              - value: "searchable_pdf"
                label: "Searchable PDF"
                label_ru: "Searchable PDF"
                tone: "office"
              - value: "odt"
                label: "ODT"
                label_ru: "ODT"
                tone: "office"
              - value: "markdown"
                label: "Markdown"
                label_ru: "Markdown"
                tone: "dev"
              - value: "json"
                label: "OCR JSON"
                label_ru: "OCR JSON"
                tone: "dev"
              - value: "html"
                label: "HTML"
                label_ru: "HTML"
                tone: "dev"
              - value: "verification"
                label: "Verification"
                label_ru: "Проверка"
                tone: "dev"
          - id: ocr_mistral_second_pass
            type: "radio"
            choice_style: "buttons"
            choice_columns: 2
            group: "local_access"
            show_if:
              ocr_engine: "mistral"
            label: "Independent second pass"
            label_ru: "Независимый второй проход"
            default: "tesseract"
            span: "full"
            hint: "Mistral keeps document structure. Yandex independently rereads the same cleaned page; Tesseract remains the local third opinion."
            hint_ru: "Mistral сохраняет структуру. Yandex независимо перечитывает тот же очищенный растр; Tesseract остаётся локальным третьим мнением."
            options:
              - value: "none"
                label: "None"
                label_ru: "Нет"
                tone: "raw"
              - value: "tesseract"
                label: "Tesseract"
                label_ru: "Tesseract"
                tone: "local"
              - value: "yandex"
                label: "Yandex"
                label_ru: "Yandex"
                tone: "yandex"
              - value: "yandex_tesseract"
                label: "Yandex + Tesseract"
                label_ru: "Yandex + Tesseract"
                tone: "warn"
          - id: ocr_yandex_2pass_scope
            type: "radio"
            choice_style: "buttons"
            choice_columns: 2
            group: "local_access"
            show_if:
              ocr_engine: "mistral"
              ocr_mistral_second_pass: ["yandex", "yandex_tesseract"]
            label: "Yandex pass scope"
            label_ru: "Область прохода Yandex"
            default: "suspicious"
            span: "full"
            options:
              - value: "suspicious"
                label: "Suspicious pages"
                label_ru: "Подозрительные страницы"
                tone: "process"
              - value: "all"
                label: "All pages"
                label_ru: "Все страницы"
                tone: "warn"
          - id: ocr_yandex_fusion
            type: "toggle"
            group: "local_access"
            show_if:
              ocr_engine: "mistral"
              ocr_mistral_second_pass: ["yandex", "yandex_tesseract"]
            label: "Use Yandex as a verified text layer"
            label_ru: "Использовать Yandex как проверяемый текстовый слой"
            default: true
            span: "half"
            hint: "Builds a verified physical grid from raster lines and the numbered column row, then assigns Mistral, Yandex and Tesseract text inside exact cells. Numeric disagreements remain review items."
            hint_ru: "Строит проверенную физическую сетку по линиям растра и строке нумерации столбцов, затем распределяет текст Mistral, Yandex и Tesseract по точным ячейкам. Расхождения цифр остаются на проверку."
          - id: ocr_yandex_2pass_model
            type: "radio"
            choice_style: "buttons"
            choice_columns: 2
            group: "advanced"
            advanced: true
            show_if:
              ocr_engine: "mistral"
              ocr_mistral_second_pass: ["yandex", "yandex_tesseract"]
            label: "Yandex second-pass model"
            label_ru: "Модель второго прохода Yandex"
            default: "page"
            span: "half"
            options:
              - value: "page"
                label: "Printed"
                label_ru: "Печатный"
                tone: "yandex"
              - value: "handwritten"
                label: "Handwriting"
                label_ru: "Рукописный"
                tone: "warn"
          - id: ocr_yandex_2pass_languages
            type: "text"
            group: "advanced"
            advanced: true
            show_if:
              ocr_engine: "mistral"
              ocr_mistral_second_pass: ["yandex", "yandex_tesseract"]
            label: "Yandex languages"
            label_ru: "Языки Yandex"
            default: "ru,en"
            span: "half"
          - id: ocr_yandex_verify_threshold
            type: "number"
            group: "advanced"
            advanced: true
            show_if:
              ocr_engine: "mistral"
              ocr_mistral_second_pass: ["yandex", "yandex_tesseract"]
            label: "Yandex numeric agreement threshold"
            label_ru: "Порог согласия цифр Yandex"
            default: 0.9
            min: 0.5
            max: 1.0
            step: 0.05
            span: "compact"
          - id: ocr_tesseract_2pass
            type: "toggle"
            group: "local_access"
            show_if:
              ocr_engine: ["yandex", "xai", "gemini", "chatgpt"]
            label: "Tesseract 2-pass"
            label_ru: "2-pass Tesseract"
            default: false
            span: "half"
            hint: "Run local Tesseract on the same cleaned page before the paid OCR engine. For xAI/Gemini/OpenAI it becomes a prompt hint; for Yandex/Mistral it is saved as a sidecar check."
            hint_ru: "Запустить локальный Tesseract по той же очищенной странице перед платным OCR. Для xAI/Gemini/OpenAI это подсказка в prompt; для Yandex/Mistral — sidecar-сверка."
          - id: ocr_tesseract_verify
            type: "toggle"
            group: "local_access"
            show_if:
              ocr_engine: "mistral"
              ocr_mistral_second_pass: ["tesseract", "yandex_tesseract"]
            label: "Verify Mistral result"
            label_ru: "Верифицировать Mistral"
            default: true
            span: "half"
            hint: "Compare normalized numbers, dates and vocabulary with Tesseract and mark the page pass/review. Pass means cross-engine agreement, not guaranteed truth."
            hint_ru: "Сравнить нормализованные числа, даты и словарь с Tesseract и присвоить странице pass/review. Pass означает согласие движков, а не гарантированную истину."
          - id: ocr_tesseract_verify_threshold
            type: "number"
            group: "advanced"
            advanced: true
            show_if:
              ocr_engine: "mistral"
              ocr_mistral_second_pass: ["tesseract", "yandex_tesseract"]
              ocr_tesseract_verify: true
            label: "Numeric agreement threshold"
            label_ru: "Порог согласия цифр"
            default: 0.9
            min: 0.5
            max: 1.0
            step: 0.05
            span: "compact"
          - id: ocr_tesseract_2pass_hint
            type: "toggle"
            group: "local_access"
            show_if:
              ocr_engine: ["xai", "gemini", "chatgpt"]
              ocr_tesseract_2pass: true
            label: "Use as hint"
            label_ru: "Дать как подсказку"
            default: true
            span: "half"
            hint: "Passes Tesseract text to the vision model as a fallible hypothesis, useful for numbers and line order on damaged scans."
            hint_ru: "Передаёт текст Tesseract vision-модели как ошибаемую гипотезу; полезно для цифр и порядка строк на повреждённых сканах."
          - id: ocr_tesseract_2pass_lang
            type: "text"
            group: "local_access"
            show_if:
              ocr_engine: ["yandex", "mistral", "xai", "gemini", "chatgpt"]
              ocr_tesseract_2pass: true
            label: "2-pass language"
            label_ru: "Язык 2-pass"
            default: "rus+eng"
            span: "half"
            hint: "Tesseract language set for the local second pass."
            hint_ru: "Набор языков Tesseract для локального второго прохода."
          - id: ocr_tesseract_2pass_psm
            type: "number"
            group: "local_access"
            show_if:
              ocr_engine: ["yandex", "mistral", "xai", "gemini", "chatgpt"]
              ocr_tesseract_2pass: true
            label: "2-pass PSM"
            label_ru: "2-pass PSM"
            default: 6
            min: 0
            max: 13
            step: 1
            span: "compact"
            hint: "Tesseract page segmentation mode. PSM 6 is a good default for document pages."
