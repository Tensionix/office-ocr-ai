            type: "number"
            label: "Low confidence"
            label_ru: "Порог сомнений"
            default: 70
            min: 0
            max: 100
            step: 1
            span: "compact"
          - id: workbench_dpi
            type: "number"
            label: "Render DPI"
            label_ru: "DPI рендера"
            default: 180
            min: 96
            max: 400
            step: 12
            span: "compact"
          - id: workbench_psm
            type: "number"
            label: "Tesseract PSM"
            label_ru: "Tesseract PSM"
            default: 6
            min: 0
            max: 13
            step: 1
            span: "compact"
            advanced: true
          - id: workbench_oem
            type: "number"
            label: "Tesseract OEM"
            label_ru: "Tesseract OEM"
            default: 1
            min: 0
            max: 3
            step: 1
            span: "compact"
            advanced: true

      - id: workbench_openai_resolver
        title: "Python OCR + OpenAI resolver"
        title_ru: "Python OCR + OpenAI resolver"
        description: "Create a local review queue and package suspicious regions for OpenAI resolution; local OCR requires optional Tesseract."
        description_ru: "Собрать локальную очередь ревью и упаковать спорные зоны для OpenAI resolver; локальный OCR требует optional Tesseract."
        service: "system_core.services.office_service:workbench_ai"
        kind: "safe"
        parameters:
