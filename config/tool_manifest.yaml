        description_ru: "Скачать portable Windows Real-ESRGAN ncnn-vulkan в tools с лицензией и manifest-файлом."
        tooltip: "Optional Vulkan image enhancer/upscaler used before OCR to reduce scan artifacts and improve weak text."
        tooltip_ru: "Опциональный Vulkan-усилитель изображений перед OCR: помогает убрать артефакты сканов, усилить слабый текст и подготовить апскейл."
        service: "system_core.services.office_service:install_realesrgan"
        kind: "safe"
      - id: surya_acceleration
        title: "Surya acceleration installs"
        title_ru: "Ускорение Surya"
        description: "Install only the acceleration module this machine needs: Vulkan, llama.cpp CUDA, or heavy PyTorch CUDA."
        description_ru: "Установить только нужный этой машине модуль ускорения: Vulkan, llama.cpp CUDA или тяжёлый PyTorch CUDA."
        tooltip: "Surya is a careful but slow local OCR/layout engine. This menu installs only the acceleration path that fits this GPU."
        tooltip_ru: "Surya - въедливый, но медленный локальный OCR/layout-движок. Здесь ставится только тот путь ускорения, который подходит этой видеокарте."
        children:
          - id: install_llamacpp_vulkan
            title: "llama.cpp Vulkan"
            title_ru: "llama.cpp Vulkan"
            description: "Recommended non-NVIDIA path. Installs Vulkan llama-server for Surya VLM inference."
            description_ru: "Рекомендованный путь без NVIDIA. Ставит Vulkan llama-server для VLM-инференса Surya."
            tooltip: "Best first choice for AMD/Intel and many non-CUDA machines: GPU acceleration through Vulkan without installing PyTorch."
            tooltip_ru: "Лучший первый вариант для AMD/Intel и многих машин без CUDA: ускорение через Vulkan без установки тяжёлого PyTorch."
            service: "system_core.services.office_service:install_llamacpp"
            kind: "safe"
            parameters:
              llamacpp_variant: "vulkan"
          - id: install_llamacpp_cuda124
            title: "llama.cpp CUDA 12.4"
            title_ru: "llama.cpp CUDA 12.4"
            description: "Light NVIDIA path for RTX 20xx/30xx/40xx before trying heavy PyTorch CUDA."
            description_ru: "Лёгкий NVIDIA-путь для RTX 20xx/30xx/40xx перед тяжёлым PyTorch CUDA."
            tooltip: "Light NVIDIA acceleration for Surya VLM inference. Try this before the huge PyTorch CUDA runtime."
            tooltip_ru: "Лёгкое NVIDIA-ускорение для VLM-инференса Surya. Его стоит попробовать до огромного PyTorch CUDA runtime."
            service: "system_core.services.office_service:install_llamacpp"
            kind: "safe"
            parameters:
              llamacpp_variant: "cuda124"
          - id: install_llamacpp_cuda133
            title: "llama.cpp CUDA 13.3"
            title_ru: "llama.cpp CUDA 13.3"
            description: "Light NVIDIA path for newest CUDA machines, including RTX 50xx when supported by drivers."
            description_ru: "Лёгкий NVIDIA-путь для новых CUDA-машин, включая RTX 50xx при поддержке драйвера."
            tooltip: "Light CUDA path for newer NVIDIA cards and drivers, especially RTX 50xx-class machines."
            tooltip_ru: "Лёгкий CUDA-путь для новых NVIDIA-карт и драйверов, особенно для машин класса RTX 50xx."
            service: "system_core.services.office_service:install_llamacpp"
            kind: "safe"
            parameters:
              llamacpp_variant: "cuda133"
          - id: install_surya_cpu
            title: "Surya CPU runtime"
            title_ru: "Surya CPU runtime"
            description: "Install Surya into its isolated optional runtime; VLM inference uses llama.cpp."
            description_ru: "Установить Surya в изолированный optional runtime; VLM-инференс использует llama.cpp."
            tooltip: "Installs Surya itself into a separate project-local Python. It is slow, but free per page and isolated from the main runtime."
            tooltip_ru: "Ставит сам Surya в отдельный project-local Python. Это медленно, зато бесплатно за страницу и не ломает основной runtime."
            service: "system_core.services.office_service:install_optional_ocr_engines"
            kind: "safe"
            parameters:
              optional_ocr_engine: "surya"
              optional_ocr_mode: "cpu"
          - id: install_surya_pytorch_cuda40
            title: "Surya PyTorch CUDA 40xx"
            title_ru: "Surya PyTorch CUDA 40xx"
            description: "Heavy NVIDIA module: installs PyTorch CUDA wheels inside Surya optional runtime for benchmarking."
            description_ru: "Тяжёлый NVIDIA-модуль: ставит PyTorch CUDA wheels внутрь optional runtime Surya для benchmark."
            tooltip: "Huge optional runtime for CUDA benchmarks on RTX 40xx-class machines. Install only if you expect a multiple-speed win."
            tooltip_ru: "Огромный optional runtime для CUDA-бенчмарков на машинах RTX 40xx. Ставить только если ждём кратный выигрыш скорости."
            service: "system_core.services.office_service:install_optional_ocr_engines"
            kind: "safe"
            parameters:
              optional_ocr_engine: "surya"
              optional_ocr_mode: "cuda40"
          - id: install_surya_pytorch_cuda50
            title: "Surya PyTorch CUDA 50xx"
            title_ru: "Surya PyTorch CUDA 50xx"
            description: "Heavy RTX 50xx test module; isolated from the core portable runtime."
            description_ru: "Тяжёлый тестовый модуль RTX 50xx; изолирован от основного portable runtime."
            tooltip: "Huge optional runtime for RTX 50xx CUDA tests. Kept isolated because PyTorch CUDA can add many gigabytes."
            tooltip_ru: "Огромный optional runtime для CUDA-тестов RTX 50xx. Изолирован отдельно, потому что PyTorch CUDA может добавить много гигабайт."
            service: "system_core.services.office_service:install_optional_ocr_engines"
            kind: "safe"
            parameters:
              optional_ocr_engine: "surya"
              optional_ocr_mode: "cuda50"
          - id: install_llamacpp
            title: "llama.cpp custom"
            title_ru: "llama.cpp вручную"
            description: "Manual installer with CPU/Vulkan/CUDA variant selector and force reinstall."
            description_ru: "Ручной installer с выбором CPU/Vulkan/CUDA и принудительной переустановкой."
            tooltip: "Manual override when the recommended one-click Vulkan/CUDA buttons are not enough for this machine."
            tooltip_ru: "Ручной override на случай, когда рекомендованных кнопок Vulkan/CUDA недостаточно для конкретной машины."
            service: "system_core.services.office_service:install_llamacpp"
            kind: "safe"
            fields:
              - id: llamacpp_variant
                type: "radio"
                choice_style: "buttons"
                choice_columns: 4
                label: "Variant"
                label_ru: "Вариант"
                default: "vulkan"
                span: "full"
                options:
                  - value: "vulkan"
                    label: "Vulkan"
                    label_ru: "Vulkan"
                    tone: "gpu"
                  - value: "cpu"
                    label: "CPU"
                    label_ru: "CPU"
                    tone: "cpu"
                  - value: "cuda124"
                    label: "CUDA 12.4"
                    label_ru: "CUDA 12.4"
                    tone: "gpu"
                  - value: "cuda133"
                    label: "CUDA 13.3"
                    label_ru: "CUDA 13.3"
                    tone: "gpu"
              - id: force_reinstall
                type: "toggle"
                label: "Force reinstall"
                label_ru: "Переустановить"
                default: false
                span: "half"
          - id: install_optional_ocr_engines
            title: "Surya custom runtime"
            title_ru: "Surya runtime вручную"
            description: "Manual Surya optional runtime installer with CPU/CUDA mode and PyTorch index override."
            description_ru: "Ручной installer optional runtime Surya с CPU/CUDA и override PyTorch index."
            tooltip: "Manual Surya installer for expert cases: CPU/CUDA mode, dry run, force reinstall, and custom PyTorch wheel index."
            tooltip_ru: "Ручной установщик Surya для экспертных случаев: CPU/CUDA mode, dry run, принудительная переустановка и свой PyTorch wheel index."
            service: "system_core.services.office_service:install_optional_ocr_engines"
            kind: "safe"
            fields:
              - id: optional_ocr_engine
                type: "radio"
                choice_style: "buttons"
                choice_columns: 1
                label: "Engine"
                label_ru: "Движок"
                default: "surya"
                span: "full"
                options:
                  - value: "surya"
                    label: "Surya"
                    label_ru: "Surya"
                    tone: "local"
              - id: optional_ocr_mode
                type: "radio"
                choice_style: "buttons"
                choice_columns: 4
                label: "Runtime"
                label_ru: "Runtime"
                default: "cpu"
                span: "full"
                options:
                  - value: "cpu"
                    label: "CPU"
                    label_ru: "CPU"
                    tone: "cpu"
                  - value: "cuda"
                    label: "CUDA"
                    label_ru: "CUDA"
                    tone: "gpu"
                  - value: "cuda40"
                    label: "CUDA 40xx"
                    label_ru: "CUDA 40xx"
                    tone: "gpu"
                  - value: "cuda50"
                    label: "CUDA 50xx"
                    label_ru: "CUDA 50xx"
                    tone: "gpu"
              - id: dry_run
                type: "toggle"
                label: "Dry run"
                label_ru: "Только показать команды"
                default: true
                span: "half"
              - id: force_reinstall
                type: "toggle"
                label: "Force reinstall"
                label_ru: "Пересобрать runtime"
                default: false
                span: "half"
              - id: torch_index_url
                type: "text"
                advanced: true
                label: "PyTorch index URL"
                label_ru: "PyTorch index URL"
                default: ""
                span: "full"
                hint: "Optional override; CUDA modes default to the current PyTorch cu128 wheel index."
                hint_ru: "Опциональный override; CUDA-режимы по умолчанию используют текущий PyTorch cu128 wheel index."
