            type: "text"
            group: "source"
            label: "Pages"
            label_ru: "Страницы"
            default: "all"
            span: "compact"
            hint: "Use all, a single page, or ranges like 6-8,12."
            hint_ru: "all, одна страница или диапазоны вроде 6-8,12."
          - id: gemini_batch_dpi
            type: "number"
            group: "source"
            label: "Render DPI"
            label_ru: "DPI рендера"
            default: 300
            min: 150
            max: 450
            step: 25
            span: "compact"
          - id: gemini_batch_preprocess_profile
