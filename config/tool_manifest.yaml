  - id: hybrid_workbench
    title: "Python OCR Workbench"
    title_ru: "Python OCR Workbench"
    description: "Optional local Tesseract OCR, heuristic review queues, coordinates, and AI resolver candidates."
    description_ru: "Опциональный локальный Tesseract OCR, эвристическая очередь ревью, координаты и кандидаты для AI resolver."
    children:
      - id: workbench_review
        title: "Local OCR review queue"
        title_ru: "Локальный OCR и очередь ревью"
        description: "Analyze PDF/images locally, flag weak OCR/table-like regions, and write reports; runs in limited review mode when Tesseract is missing."
        description_ru: "Локально анализировать PDF/изображения, отмечать слабые OCR/table-зоны и писать отчёты; без Tesseract работает в ограниченном review-режиме."
        service: "system_core.services.office_service:workbench_review"
        kind: "safe"
        fields:
          - id: workbench_ocr_engine
            type: "select"
            label: "Local OCR"
            label_ru: "Локальный OCR"
            default: "auto"
            span: "half"
            options:
              - value: "auto"
                label: "Auto"
                label_ru: "Авто"
              - value: "tesseract"
                label: "Tesseract"
