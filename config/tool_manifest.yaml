      - id: numeric_check_pass
        title: "Numeric check"
        title_ru: "Проверка реквизитов"
        description: "Crop numeric legal/financial lines on one page and verify exact identifiers with a selected xAI vision model."
        description_ru: "Вырезать числовые юридические/финансовые строки на одной странице и проверить точные реквизиты выбранной xAI vision-моделью."
        tooltip: "Use this after OCR when contract numbers, IKZ, INN/KPP, account numbers, dates or sums matter. In Auto mode Tesseract is used only if present; otherwise the selected Grok model checks the page directly."
        tooltip_ru: "Используйте после OCR, когда важны номера контрактов, ИКЗ, ИНН/КПП, счета, даты или суммы. В режиме Авто Tesseract используется только если установлен; иначе выбранная Grok-модель проверяет страницу напрямую."
        service: "system_core.services.office_service:numeric_check_pass"
        kind: "safe"
        fields:
          - id: numeric_source
            type: "text"
            group: "source"
            label: "PDF/image"
            label_ru: "PDF/изображение"
            default: "input/1_Псковская_Псковский.pdf"
            span: "full"
            hint: "Relative to project root or absolute. Folder means first supported PDF/image inside it."
            hint_ru: "Относительный путь от корня проекта или абсолютный. Папка означает первый найденный PDF/скан внутри."
          - id: numeric_page
            type: "number"
            group: "source"
            label: "Page"
            label_ru: "Страница"
            default: 1
            min: 1
            max: 9999
            step: 1
            span: "compact"
            hint: "One page only, so you can check risky identifiers before a large run."
            hint_ru: "Только одна страница, чтобы проверить рискованные реквизиты перед большим прогоном."
          - id: numeric_dpi
            type: "number"
            group: "source"
            label: "Render DPI"
            label_ru: "DPI рендера"
            default: 300
            min: 120
            max: 600
            step: 25
            span: "compact"
            hint: "300 DPI is a good default for legal scans; raise it only when tiny numbers are unreadable."
            hint_ru: "300 DPI обычно достаточно для юридических сканов; повышайте только если мелкие цифры не читаются."
          - id: xai_model
            type: "radio"
            choice_style: "buttons"
            choice_columns: 4
            group: "model"
            label: "xAI verifier"
            label_ru: "xAI-проверка"
            default: "grok-4.3"
            span: "full"
            options_source: "system_core.services.office_service:xai_vision_model_options"
            cache_seconds: 900
            cache_fields: ["xai_api_key"]
            refresh_label: "Refresh xAI models"
            refresh_label_ru: "Обновить модели xAI"
            hint: "OCR fast is the first choice; OCR quality is slower and more expensive, useful only if the fast verifier disagrees with the crop."
            hint_ru: "OCR fast — первый выбор; OCR quality медленнее и дороже, имеет смысл только если fast спорит с кропом."
            options:
              - value: "grok-4.3"
                label: "grok-4.3"
                label_ru: "grok-4.3"
                tone: "vision"
              - value: "grok-4.20-non-reasoning-latest"
                label: "4.20 fast"
                label_ru: "4.20 fast"
                tone: "vision"
              - value: "grok-4.20-reasoning-latest"
                label: "4.20 quality"
                label_ru: "4.20 quality"
                tone: "warn"
          - id: xai_api_key
            type: "select"
            group: "access"
            label: "xAI key"
            label_ru: "Ключ xAI"
            default: ""
            options_source: "system_core.services.office_service:xai_api_key_options"
            cache_seconds: 10
            span: "half"
            hint: "The selected key is used only for the small cropped verifier calls."
            hint_ru: "Выбранный ключ используется только для маленьких verifier-запросов по кропам."
          - id: numeric_locator
            type: "radio"
            choice_style: "buttons"
            choice_columns: 4
            group: "parameters"
            label: "Locator"
            label_ru: "Локатор"
            default: "auto"
            span: "full"
            hint: "Auto uses local Tesseract for cheap line crops, then Surya if installed, and only then falls back to a paid full-page vision check."
            hint_ru: "Авто использует локальный Tesseract для дешёвых кропов строк, затем Surya если установлен, и только потом платную vision-проверку всей страницы."
            options:
              - value: "auto"
                label: "Auto"
                label_ru: "Авто"
                tone: "process"
              - value: "tesseract"
                label: "Tesseract"
                label_ru: "Tesseract"
                tone: "local"
              - value: "surya"
                label: "Surya"
                label_ru: "Surya"
                tone: "local"
              - value: "vision-page"
                label: "Vision page"
                label_ru: "Страница vision"
                tone: "vision"
          - id: numeric_locator_hint
            type: "toggle"
            group: "parameters"
            label: "Use local hint"
            label_ru: "Локальная подсказка"
            default: true
            span: "half"
            hint: "When a local locator is available, passes its reading to the model as a hypothesis, then reports match/mismatch instead of silently trusting either side."
            hint_ru: "Когда локальный локатор доступен, передаёт его чтение модели как гипотезу, затем показывает match/mismatch вместо слепого доверия одной стороне."
          - id: numeric_max_candidates
            type: "number"
            group: "parameters"
            label: "Max crops"
            label_ru: "Кропов максимум"
            default: 6
            min: 1
            max: 20
            step: 1
            span: "compact"
            hint: "Limits paid verifier calls. Start with 3-6 crops on heavy pages."
            hint_ru: "Ограничивает платные verifier-запросы. Для тяжёлых страниц начните с 3-6 кропов."
          - id: numeric_min_digits
            type: "number"
            group: "parameters"
            label: "Min digits"
            label_ru: "Минимум цифр"
            default: 8
            min: 4
            max: 40
            step: 1
            span: "compact"
            hint: "Lower values catch dates and short document numbers; higher values focus on long IDs."
            hint_ru: "Меньшие значения ловят даты и короткие номера; большие фокусируются на длинных идентификаторах."
          - id: surya_backend
            type: "radio"
            choice_style: "buttons"
            choice_columns: 2
            group: "advanced"
            advanced: true
            show_if:
              numeric_locator: "surya"
            label: "Surya backend"
            label_ru: "Surya backend"
            default: "llamacpp"
            span: "full"
            hint: "llama.cpp keeps Surya portable and can use Vulkan/CUDA builds when installed; vLLM is the heavier PyTorch CUDA path."
            hint_ru: "llama.cpp оставляет Surya портативным и может использовать Vulkan/CUDA-сборки; vLLM — тяжёлый PyTorch CUDA-путь."
            options:
              - value: "llamacpp"
                label: "llama.cpp"
                label_ru: "llama.cpp"
                tone: "local"
              - value: "vllm"
                label: "vLLM"
                label_ru: "vLLM"
                tone: "gpu"
          - id: surya_timeout_sec
            type: "number"
            group: "advanced"
            advanced: true
            show_if:
              numeric_locator: "surya"
            label: "Surya timeout"
            label_ru: "Surya timeout"
            default: 900
            min: 60
            max: 3600
            step: 60
            span: "compact"
            hint: "Surya can be slow on CPU; keep this high for damaged pages."
            hint_ru: "Surya на CPU может быть медленным; для убитых страниц оставляйте запас."
          - id: ocr_denoise
            type: "radio"
            choice_style: "buttons"
            choice_columns: 3
            group: "filters"
            label: "Denoise"
            label_ru: "Шум JPEG"
            default: "weak"
            span: "full"
            hint: "Weak JPEG cleanup usually keeps digits readable while removing compression dirt."
            hint_ru: "Слабая очистка JPEG обычно сохраняет цифры читаемыми и убирает компрессионную грязь."
            options:
              - value: "none"
                label: "None"
                label_ru: "Нет"
              - value: "weak"
                label: "Weak"
                label_ru: "Слабый"
                tone: "process"
              - value: "strong"
                label: "Strong"
                label_ru: "Сильный"
                tone: "warn"
          - id: ocr_contrast
            type: "radio"
            choice_style: "buttons"
            choice_columns: 3
            group: "filters"
            label: "Contrast"
            label_ru: "Контраст"
            default: "high"
            span: "full"
            hint: "High contrast separates touching pixels in worn numbers and headings."
            hint_ru: "Высокий контраст разделяет слипшиеся пиксели в повреждённых цифрах и заголовках."
            options:
              - value: "auto"
                label: "Auto"
                label_ru: "Авто"
                tone: "process"
              - value: "normal"
                label: "Normal"
                label_ru: "Норма"
                tone: "cpu"
              - value: "high"
                label: "High"
                label_ru: "Высокий"
                tone: "warn"
          - id: ocr_unsharp
            type: "radio"
            choice_style: "buttons"
            choice_columns: 3
            group: "filters"
            label: "Unsharp"
            label_ru: "Unsharp"
            default: "strong"
            span: "full"
            hint: "Sharpens digit edges after cleanup. Strong is useful for blurred legal scans."
            hint_ru: "Подчеркивает края цифр после очистки. Strong полезен для размытых юридических сканов."
            options:
              - value: "auto"
                label: "Auto"
                label_ru: "Авто"
                tone: "process"
              - value: "off"
                label: "Off"
                label_ru: "Выкл"
                tone: "raw"
              - value: "strong"
                label: "Strong"
                label_ru: "Сильный"
                tone: "warn"
          - id: ocr_binarize
            type: "radio"
            choice_style: "buttons"
            choice_columns: 3
            group: "filters"
            label: "Binarize"
            label_ru: "Бинаризация"
            default: "off"
            span: "full"
            hint: "Turns pixels into black/white. It can help text but often damages thin numbers, so off is the numeric default."
            hint_ru: "Превращает пиксели в чёрно-белые. Иногда помогает тексту, но часто портит тонкие цифры, поэтому для реквизитов по умолчанию выключено."
            options:
              - value: "auto"
                label: "Auto"
                label_ru: "Авто"
              - value: "on"
                label: "Force on"
                label_ru: "Включить"
                tone: "warn"
              - value: "off"
                label: "Force off"
                label_ru: "Выключить"
          - id: ocr_deskew
            type: "toggle"
            group: "options"
            label: "Deskew"
            label_ru: "Выравнивать наклон"
            default: true
            span: "half"
            hint: "Straightens slightly rotated scans before the local numeric locator runs."
            hint_ru: "Выравнивает слегка повернутые сканы перед локальным поиском числовых строк."
          - id: ocr_tesseract_lang
            type: "text"
            group: "advanced"
            advanced: true
            label: "Tesseract language"
            label_ru: "Язык Tesseract"
            default: "rus+eng"
            span: "half"
            hint: "Languages for the local locator. rus+eng is the safest default for Russian contracts with Latin abbreviations."
            hint_ru: "Языки локального локатора. rus+eng — безопасный вариант для русских контрактов с латинскими сокращениями."
          - id: ocr_tesseract_psm
            type: "number"
            group: "advanced"
            advanced: true
            label: "Tesseract PSM"
            label_ru: "Tesseract PSM"
            default: 6
            min: 0
            max: 13
            step: 1
            span: "compact"
            hint: "Page segmentation mode for local line finding. PSM 6 works well on full document pages."
            hint_ru: "Режим разметки страницы для локального поиска строк. PSM 6 обычно хорош для полных страниц документа."
      - id: yandex_ocr_smoke
        title: "Yandex OCR smoke test"
        title_ru: "Yandex OCR smoke test"
        description: "Send one generated test image to Yandex OCR to validate key, folder id and billing access."
        description_ru: "Отправить одно тестовое изображение в Yandex OCR для проверки ключа, folder id и billing."
        tooltip: "A tiny paid-provider check: verifies that Yandex key, folder_id, roles, and billing can actually process one image."
        tooltip_ru: "Маленькая проверка платного провайдера: ключ Yandex, folder_id, роли и billing действительно могут обработать одно изображение."
        service: "system_core.services.office_service:yandex_ocr_smoke"
        kind: "safe"
        parameters:
          provider: "yandex"
        fields:
          - id: yandex_model
            type: "radio"
            choice_style: "buttons"
            choice_columns: 3
            group: "model"
            label: "Yandex mode"
            label_ru: "Режим Yandex"
            default: "page"
            span: "full"
            options_source: "system_core.services.office_service:yandex_ocr_model_options"
            cache_seconds: 900
            refresh_label: "Refresh OCR models"
            refresh_label_ru: "Обновить OCR модели"
            hint: "Refresh queries the Yandex model API when possible and keeps an OCR-safe cached selector."
            hint_ru: "Обновление по возможности запрашивает Yandex model API и держит безопасный OCR-кэш."
            options:
              - value: "page"
                label: "Printed"
                label_ru: "Печатный"
                tone: "yandex"
              - value: "page-column-sort"
                label: "Columns"
                label_ru: "Колонки"
                tone: "yandex"
              - value: "handwritten"
                label: "Handwriting"
                label_ru: "Рукописный"
                tone: "warn"
          - id: yandex_languages
            type: "text"
            group: "parameters"
            label: "Languages"
            label_ru: "Языки"
            default: "ru,en"
            span: "half"
          - id: yandex_api_key
            type: "select"
            group: "access"
            label: "API key"
            label_ru: "Ключ"
            default: ""
            options_source: "system_core.services.office_service:api_key_options"
            cache_seconds: 10
            span: "half"
      - id: xai_ocr_smoke
        title: "xAI OCR smoke test"
        title_ru: "xAI OCR smoke test"
        description: "Send one generated test image to xAI vision OCR to validate key and model access."
        description_ru: "Отправить одно тестовое изображение в xAI vision OCR для проверки ключа и доступа к модели."
        tooltip: "A tiny xAI vision check: sends one generated image to the selected Grok model and verifies that image-to-text works."
        tooltip_ru: "Маленькая проверка xAI vision: отправляет одно сгенерированное изображение выбранной Grok-модели и проверяет image-to-text."
        service: "system_core.services.office_service:xai_ocr_smoke"
        kind: "safe"
        parameters:
          provider: "xai"
        fields:
          - id: xai_model
            type: "radio"
            choice_style: "buttons"
            choice_columns: 4
            group: "model"
            label: "xAI model"
            label_ru: "Модель xAI"
            default: "grok-4.3"
            span: "full"
            options_source: "system_core.services.office_service:xai_vision_model_options"
            cache_seconds: 900
            cache_fields: ["xai_api_key"]
            refresh_label: "Refresh xAI models"
            refresh_label_ru: "Обновить модели xAI"
            options:
              - value: "grok-4.3"
                label: "grok-4.3"
                label_ru: "grok-4.3"
                tone: "vision"
              - value: "grok-4.20-non-reasoning-latest"
                label: "4.20 fast"
                label_ru: "4.20 fast"
                tone: "vision"
              - value: "grok-4.20-reasoning-latest"
                label: "4.20 quality"
                label_ru: "4.20 quality"
                tone: "warn"
              - value: "grok-latest"
                label: "Latest"
                label_ru: "Latest"
                tone: "vision"
          - id: xai_api_key
            type: "select"
            group: "access"
            label: "API key"
            label_ru: "Ключ"
            default: ""
            options_source: "system_core.services.office_service:xai_api_key_options"
            cache_seconds: 10
            span: "half"
      - id: mistral_ocr_smoke
        title: "Mistral OCR 4 smoke test"
        title_ru: "Mistral OCR 4 smoke test"
        description: "Send one generated Russian page with a table and formula to Mistral OCR 4."
        description_ru: "Отправить одну тестовую русскую страницу с таблицей и формулой в Mistral OCR 4."
        tooltip: "A tiny paid check of the key, billing, Cyrillic OCR, table extraction and structural blocks."
        tooltip_ru: "Маленькая платная проверка ключа, billing, кириллицы, таблицы и структурных блоков."
        service: "system_core.services.office_service:mistral_ocr_smoke"
        kind: "safe"
        parameters:
          provider: "mistral"
        fields:
          - id: mistral_model
            type: "radio"
            choice_style: "buttons"
            choice_columns: 2
            group: "model"
            label: "Mistral OCR model"
            label_ru: "Модель Mistral OCR"
            default: "mistral-ocr-4-0"
            span: "full"
            options:
              - value: "mistral-ocr-4-0"
                label: "OCR 4 pinned"
                label_ru: "OCR 4 закреплённая"
                tone: "vision"
              - value: "mistral-ocr-latest"
                label: "OCR latest"
                label_ru: "OCR latest"
                tone: "warn"
          - id: mistral_api_key
            type: "select"
            group: "access"
            label: "API key"
            label_ru: "Ключ"
            default: ""
            options_source: "system_core.services.office_service:mistral_api_key_options"
            cache_seconds: 10
            span: "half"

maintenance_operations:
  - id: cleanup_document_model_artifacts
    title: "Clear DocumentModel artifacts"
    title_ru: "Очистить DocumentModel"
    description: "Delete internal *.document packages and machine JSON verification exports from managed output/report/workspace. Keep DOCX, XLSX, Markdown, PDF, images and source files."
    description_ru: "Удалить внутренние пакеты *.document и машинные JSON проверки из управляемых output/report/workspace. Сохранить DOCX, XLSX, Markdown, PDF, изображения и исходники."
    service: "system_core.services.office_service:cleanup_document_model_artifacts"
    kind: "dangerous"

  - id: copy_output_markdown_to_input
    title: "Copy Markdown output to input"
    title_ru: "Markdown output -> input"
    description: "Copy generated .md files from output back into input for a second-stage build."
    description_ru: "Скопировать .md из output обратно в input для второго этапа сборки."
    service: "system_core.services.office_service:copy_output_markdown_to_input"
    kind: "safe"

  - id: cleanup_input_output
    title: "Clear I/O"
    title_ru: "Очистить I/O"
    description: "Delete contents of managed input and output folders, including stale placeholders."
    description_ru: "Удалить содержимое управляемых папок input и output, включая старые placeholder-файлы."
    service: "system_core.services.office_service:cleanup_input_output"
    kind: "dangerous"
